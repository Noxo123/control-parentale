<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noxo Parental Control</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-white min-h-screen"><div class="max-w-6xl mx-auto p-6"><header class="mb-8"><h1 class="text-3xl font-bold">Noxo Parental Control</h1><p class="text-slate-400">Dashboard Windows</p></header><section id="login" class="max-w-md bg-slate-900 rounded-2xl p-6"><input id="pin" type="password" placeholder="PIN parent" class="w-full bg-slate-800 rounded-lg p-3 mb-3"><button onclick="login()" class="w-full bg-indigo-600 rounded-lg p-3">Connexion</button><p id="err" class="text-red-400 mt-2"></p></section><main id="app" class="hidden"><div class="grid md:grid-cols-3 gap-4 mb-6"><div class="bg-slate-900 rounded-2xl p-5"><span class="text-slate-400">Limite</span><b id="limit" class="block text-3xl mt-2">—</b></div><div class="bg-slate-900 rounded-2xl p-5"><span class="text-slate-400">Horaires</span><b id="hours" class="block text-3xl mt-2">—</b></div><div class="bg-slate-900 rounded-2xl p-5"><span class="text-slate-400">Blocages</span><b id="count" class="block text-3xl mt-2">—</b></div></div><div class="grid lg:grid-cols-2 gap-6"><section class="bg-slate-900 rounded-2xl p-6"><h2 class="text-xl font-semibold mb-4">Temps d'écran</h2><div class="grid grid-cols-3 gap-2"><input id="daily" type="number" min="1" max="1440" class="bg-slate-800 rounded p-2"><input id="start" type="time" class="bg-slate-800 rounded p-2"><input id="end" type="time" class="bg-slate-800 rounded p-2"></div><button onclick="save()" class="mt-4 bg-indigo-600 rounded p-2 px-4">Enregistrer</button></section><section class="bg-slate-900 rounded-2xl p-6"><h2 class="text-xl font-semibold mb-4">Applications bloquées</h2><div class="flex gap-2"><input id="process" placeholder="discord" class="flex-1 bg-slate-800 rounded p-2"><button onclick="add()" class="bg-red-600 rounded p-2 px-4">Bloquer</button></div><div id="apps" class="mt-4 space-y-2"></div></section><section class="bg-slate-900 rounded-2xl p-6 lg:col-span-2"><h2 class="text-xl font-semibold mb-4">Journal</h2><div id="events" class="space-y-2 max-h-80 overflow-auto"></div></section></div></main></div><script>let pin='';async function api(u,o={}){o.headers={...(o.headers||{}),'X-Parent-Pin':pin};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}async function login(){pin=document.querySelector('#pin').value;try{await api('/api/status');document.querySelector('#login').classList.add('hidden');document.querySelector('#app').classList.remove('hidden');refresh()}catch(e){document.querySelector('#err').textContent=e.message;pin=''}}async function refresh(){let[s,a,e]=await Promise.all([api('/api/settings'),api('/api/blocked-apps'),api('/api/events')]);daily.value=s.daily_limit_minutes;start.value=s.start_time;end.value=s.end_time;limit.textContent=s.daily_limit_minutes+' min';hours.textContent=s.start_time+' → '+s.end_time;count.textContent=a.length;apps.innerHTML=a.map(x=>`<div class="bg-slate-800 rounded p-2 flex justify-between"><span>${esc(x.process_name)}.exe</span><button onclick="removeApp(${x.id})" class="text-red-400">Retirer</button></div>`).join('')||'<p class="text-slate-500">Aucun blocage</p>';events.innerHTML=e.map(x=>`<div class="border-b border-slate-800 pb-2"><div>${esc(x.message)}</div><small class="text-slate-500">${esc(x.created_at)} · ${esc(x.type)}</small></div>`).join('')}async function save(){try{await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({daily_limit_minutes:+daily.value,start_time:start.value,end_time:end.value})});refresh()}catch(e){alert(e.message)}}async function add(){try{await api('/api/blocked-apps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({process_name:process.value})});process.value='';refresh()}catch(e){alert(e.message)}}async function removeApp(id){await api('/api/blocked-apps/'+id,{method:'DELETE'});refresh()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</script></body></html>
