name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Agent
        run: dotnet publish Agent/NoxoParental.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Rename EXE
        shell: pwsh
        run: Rename-Item publish/NoxoParental.exe NoxoParental.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NoxoParental-Windows-x64
          path: publish/NoxoParental.exe
          if-no-files-found: error
