name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Agent/NoxoParental.csproj

      - name: Build and publish EXE
        run: dotnet publish Agent/NoxoParental.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-Item "publish/NoxoParental.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "NoxoParental.exe introuvable après le publish."; exit 1 }
          Write-Host "EXE: $($exe.FullName) - $($exe.Length) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoxoParental-Windows-x64
          path: publish/NoxoParental.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag publish/NoxoParental.exe --repo "${{ github.repository }}" --title "Noxo Parental $tag" --generate-notes
          } else {
            gh release upload $tag publish/NoxoParental.exe --repo "${{ github.repository }}" --clobber
          }
