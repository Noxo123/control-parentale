name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Agent/NoxoParental.csproj
      - name: Build
        run: dotnet publish Agent/NoxoParental.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NoxoParental-Windows
          path: publish/NoxoParental.exe
